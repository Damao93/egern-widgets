name: 中国电信·Hark iOS
description: |-
  中国电信套餐查询｜iOS 三环面板
  • 账户信息：显示剩余话费、更新时间；大号组件显示脱敏手机号，话费低于 10 元时突出提示。
  • 三环用量：分别展示通用流量、定向流量和语音；配有数值、比例及进度条，缺少明细时显示未知。
  • 统计选项：支持通用／定向筛选，以及流量和语音的已用／剩余切换；未选中的流量标注为未计入。
  • 用量参考：提供今日已记录消耗、近 7 日采样趋势；日均可用按当前余量摊至自然月月底估算，并非套餐结算日或官方账单。
  • 多种尺寸：支持小、中、大、超大桌面组件及三种锁屏组件，配色适配系统深浅色外观。
  • 查询方式：手机号＋服务密码登录，可沿用已有设备 ID；成功查询后 30 分钟内复用数据，不添加登录抓取、HTTPS 解密或后台保活任务，实际刷新由 iOS 调度。
  • 使用提示：首次使用需积累趋势数据；账号信息仅在自己的模块设置中填写，不同样式选一个启用即可。
author: iBL3ND（电信后端） / zhaohantao1360-hash/Hark（界面） / 电信适配版
icon: https://iili.io/nEufFXR.png
homepage: https://github.com/Damao93/egern-widgets
compat_arguments:
  ctPhone: ''
  ctPassword: ''
  ctDeviceId: ''
  ctShowGeneralFlow: 'true'
  ctShowDirectionalFlow: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctTitle: ''
compat_arguments_schema:
  ctPhone:
    name: 手机号
    description: 中国电信手机号
    default_value: ''
  ctPassword:
    name: 服务密码
    description: 电信APP 设置 账户与安全里 获取服务密码
    default_value: ''
  ctDeviceId:
    name: 设备 ID
    description: '复制网站去浏览器打开获取设备ID  使用步骤：1.使用短信登录授权设备 2. 复制显示的设备 ID 在此填写 3.获取方式：网站 https://telecom.nufe.ccwu.cc'
    default_value: ''
  ctShowGeneralFlow:
    name: 显示通用流量
    description: 关闭则只统计定向流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowDirectionalFlow:
    name: 显示定向流量
    description: 关闭则只统计通用流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
dns: {}
scriptings:
- generic:
    name: china-telecom-hark-ios
    script_url: https://raw.githubusercontent.com/Damao93/egern-widgets/main/ChinaTelecom/CT_Widget_Hark.js
    env:
      CT_PHONE: '{{{ctPhone}}}'
      CT_PASSWORD: '{{{ctPassword}}}'
      CT_DEVICE_ID: '{{{ctDeviceId}}}'
      CT_SHOW_GENERAL_FLOW: '{{{ctShowGeneralFlow}}}'
      CT_SHOW_DIRECTIONAL_FLOW: '{{{ctShowDirectionalFlow}}}'
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_TITLE: '{{{ctTitle}}}'
widgets:
- name: china-telecom-hark-ios
  script_name: china-telecom-hark-ios
