name: 中国电信小组件·玻璃版
description: |-
  中国电信套餐查询｜玻璃仪表盘
  • 账户信息：显示剩余话费、流量与语音，标注数据更新时间。
  • 套餐用量：展示流量总量、已用、剩余及用量进度；接口未提供的明细显示为未知。
  • 统计选项：可选择通用、定向流量参与统计，并切换流量及语音的已用／剩余显示。
  • 消耗趋势：按已记录的余量变化估算今日消耗，首次使用需积累数据，不等同于运营商全天账单。
  • 多种尺寸：支持小、中、大、超大桌面组件及三种锁屏组件，文字适配系统深浅色外观。
  • 查询方式：手机号＋服务密码登录，可沿用已有设备 ID；成功查询后 30 分钟内复用数据，临时网络异常时尝试显示缓存，实际刷新由 iOS 调度。
  • 使用提示：账号信息仅在自己的模块设置中填写；不同样式选一个启用即可，切换前关闭旧模块。
author: iBL3ND（电信后端） / moyuzaime（界面） / 界面适配版
icon: https://iili.io/nEufFXR.png
homepage: https://github.com/Damao93/egern-widgets
compat_arguments:
  ctPhone: ''
  ctPassword: ''
  ctDeviceId: ''
  ctShowGeneralFlow: 'true'
  ctShowDirectionalFlow: 'true'
  ctShowUsedFlow: 'false'
  ctShowUsedVoice: 'false'
  ctTitle: ''
compat_arguments_schema:
  ctPhone:
    name: 手机号
    description: 中国电信手机号
    default_value: ''
  ctPassword:
    name: 服务密码
    description: 电信APP 设置 账户与安全里 获取服务密码
    default_value: ''
  ctDeviceId:
    name: 设备 ID
    description: '复制网站去浏览器打开获取设备ID  使用步骤：1.使用短信登录授权设备 2. 复制显示的设备 ID 在此填写 3.获取方式：网站 https://telecom.nufe.ccwu.cc'
    default_value: ''
  ctShowGeneralFlow:
    name: 显示通用流量
    description: 关闭则只统计定向流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowDirectionalFlow:
    name: 显示定向流量
    description: 关闭则只统计通用流量
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  ctShowUsedFlow:
    name: 显示已用流量
    description: 开启显示已用流量，关闭显示剩余流量
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctShowUsedVoice:
    name: 显示已用语音
    description: 开启显示已用语音，关闭显示剩余语音
    default_value: 'false'
    options:
    - 'true'
    - 'false'
  ctTitle:
    name: 小组件标题
    description: 默认"中国电信"，可自定义
    default_value: ''
dns: {}
scriptings:
- generic:
    name: china-telecom
    script_url: https://raw.githubusercontent.com/Damao93/egern-widgets/main/ChinaTelecom/CT_Widget_Glass.js
    env:
      CT_PHONE: '{{{ctPhone}}}'
      CT_PASSWORD: '{{{ctPassword}}}'
      CT_DEVICE_ID: '{{{ctDeviceId}}}'
      CT_SHOW_GENERAL_FLOW: '{{{ctShowGeneralFlow}}}'
      CT_SHOW_DIRECTIONAL_FLOW: '{{{ctShowDirectionalFlow}}}'
      CT_SHOW_USED_FLOW: '{{{ctShowUsedFlow}}}'
      CT_SHOW_USED_VOICE: '{{{ctShowUsedVoice}}}'
      CT_TITLE: '{{{ctTitle}}}'
widgets:
- name: china-telecom
  script_name: china-telecom
